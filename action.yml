name: "Dad Joke Action"
description: "從外部 API 擷取隨機笑話並透過 Action Output 輸出給後續步驟"
author: "GH-200 Course"

# 定義 Action 的輸出參數
outputs:
  joke:
    description: "取得的笑話純文字內容"

# 定義 Action 的執行環境與進入點
runs:
  using: "node20"
  main: "dist/index.js"

# 市集顯示與識別圖示（選用）
branding:
  icon: "smile"
  color: "yellow"